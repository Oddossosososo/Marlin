name: Check Marlin C++

on:
  push:
    branches: [main, migration/cpp-engine]
    paths:
      - "cpp/**"
      - ".github/workflows/check-marlin-cpp.yml"
  pull_request:
    branches: [main]
    paths:
      - "cpp/**"
      - ".github/workflows/check-marlin-cpp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cpp --parallel
      - name: Run tests
        run: ctest --test-dir build/cpp --output-on-failure
