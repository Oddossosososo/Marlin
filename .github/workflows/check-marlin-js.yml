name: MARLIN JavaScript checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install chess rules library
        run: npm install --no-save chess.js
      - name: Check JavaScript module syntax
        run: |
          set -euo pipefail
          for file in \
            engine-v7.js \
            engine-v8.js \
            evaluation-v8.js \
            engine-v6.js \
            engine-v7-policy.js \
            engine-v6-policy.js \
            evaluation-v7.js \
            nnue-v7.js \
            engine-worker.js \
            arena-worker.js \
            benchmark-worker.js \
            benchmark.js \
            marlin-v9.js \
            opening-book-v9.js \
            opening-policy-v9.js \
            opening-book-v9-smoke-test.js \
            lichess-bot.js \
            lichess-v9-smoke-test.js \
            training/smoke-v8.mjs \
            app.js
          do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
          node training/smoke-v8.mjs
          node lichess-v9-smoke-test.js
          node opening-book-v9-smoke-test.js
