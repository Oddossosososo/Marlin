name: MARLIN C++ Core Checks

on:
  push:
    branches:
      - v8-development
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp-tests:
    name: Build and test C++ engine foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout v8-development
        uses: actions/checkout@v5
        with:
          ref: v8-development

      - name: Compile with strict warnings
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -pedantic \
            -Icpp/include cpp/src/bitboard.cpp cpp/src/board.cpp \
            cpp/tests/bitboard_tests.cpp cpp/tests/board_tests.cpp \
            -o /tmp/marlin-cpp-tests

      - name: Run bitboard and legal-move tests
        run: /tmp/marlin-cpp-tests
