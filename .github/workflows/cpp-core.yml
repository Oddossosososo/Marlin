name: MARLIN C++ Core Checks

on:
  push:
    branches:
      - v8-development
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bitboard-tests:
    name: Build and test C++ bitboards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v8-development
        uses: actions/checkout@v5
        with:
          ref: v8-development

      - name: Compile with strict warnings
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -Icpp/include cpp/src/bitboard.cpp cpp/tests/bitboard_tests.cpp \
            -o /tmp/marlin-bitboard-tests

      - name: Run bitboard tests
        run: /tmp/marlin-bitboard-tests
