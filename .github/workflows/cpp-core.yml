name: MARLIN C++ Engine Checks

on:
  push:
    branches:
      - v8-development
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp-tests:
    name: Compile, perft and search tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout v8-development
        uses: actions/checkout@v5
        with:
          ref: v8-development

      - name: Compile C++ engine and separate test executables
        run: |
          CORE="cpp/src/bitboard.cpp cpp/src/board.cpp cpp/src/search.cpp"
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -pedantic -Icpp/include $CORE cpp/tests/bitboard_tests.cpp -o /tmp/marlin-bitboard-tests
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -pedantic -Icpp/include $CORE cpp/tests/board_tests.cpp -o /tmp/marlin-board-tests
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -pedantic -Icpp/include $CORE cpp/tests/search_tests.cpp -o /tmp/marlin-search-tests
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -pedantic -Icpp/include $CORE cpp/src/uci.cpp -o /tmp/marlin-uci

      - name: Run bitboard tests
        run: /tmp/marlin-bitboard-tests

      - name: Run legal-move and perft tests
        run: /tmp/marlin-board-tests

      - name: Run alpha-beta search tests
        run: /tmp/marlin-search-tests

      - name: Smoke-test UCI protocol
        run: |
          printf 'uci\nisready\nposition startpos\ngo depth 3\nquit\n' | /tmp/marlin-uci | tee /tmp/uci-output.txt
          grep -q '^uciok$' /tmp/uci-output.txt
          grep -q '^readyok$' /tmp/uci-output.txt
          grep -q '^bestmove ' /tmp/uci-output.txt
