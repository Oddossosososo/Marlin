name: MARLIN C++ Engine Checks

on:
  push:
    branches:
      - v8-development
    paths:
      - 'cpp/**'
      - '.github/workflows/cpp-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp-tests:
    name: Compile, perft and search tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout v8-development
        uses: actions/checkout@v5
        with:
          ref: v8-development

      - name: Compile C++ engine and tests
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -pedantic \
            -Icpp/include cpp/src/bitboard.cpp cpp/src/board.cpp cpp/src/search.cpp \
            cpp/tests/bitboard_tests.cpp cpp/tests/board_tests.cpp cpp/tests/search_tests.cpp \
            -o /tmp/marlin-cpp-tests
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -pedantic \
            -Icpp/include cpp/src/bitboard.cpp cpp/src/board.cpp cpp/src/search.cpp \
            cpp/src/uci.cpp -o /tmp/marlin-uci

      - name: Run correctness and search tests
        run: /tmp/marlin-cpp-tests

      - name: Smoke-test UCI protocol
        run: |
          printf 'uci\nisready\nposition startpos\ngo depth 3\nquit\n' | /tmp/marlin-uci | tee /tmp/uci-output.txt
          grep -q '^uciok$' /tmp/uci-output.txt
          grep -q '^readyok$' /tmp/uci-output.txt
          grep -q '^bestmove ' /tmp/uci-output.txt
