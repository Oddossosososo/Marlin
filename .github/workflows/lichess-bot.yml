name: MARLIN Lichess Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lichess-bot:
    if: github.ref == 'refs/heads/v8-development'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out MARLIN
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check bot and engine syntax
        run: |
          node --check lichess-bot.js
          node --check engine-v8.js

      - name: Start MARLIN V8 on Lichess
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          LICHESS_USERNAME: ${{ vars.LICHESS_USERNAME }}
          MARLIN_DEPTH: "10"
        run: npm run lichess-bot
