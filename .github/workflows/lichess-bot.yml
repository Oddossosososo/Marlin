name: MARLIN V9 Lichess Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nnue/marlin-v9.nnue.json"
      - "nnue/marlin-v9-opening-book.json"
  schedule:
    # Restart shortly after the 350-minute GitHub Actions job timeout.
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: marlin-v9-lichess-bot
  cancel-in-progress: true

jobs:
  lichess-bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out MARLIN V9
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install bot dependencies
        run: npm install --no-audit --no-fund

      - name: Check V9 bot syntax
        run: |
          node --check marlin-v9.js
          node --check lichess-bot.js
          node --check lichess-v9-smoke-test.js

      - name: Test V9 WebAssembly search and legal moves
        run: npm run test:lichess-v9

      - name: Start MARLIN V9 on Lichess
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS1_TOKEN || secrets.LICHESS_TOKEN }}
          LICHESS_USERNAME: ${{ vars.LICHESS_USERNAME }}
          MARLIN_DEPTH: "${{ vars.MARLIN_DEPTH || '4' }}"
        run: npm run lichess-bot
