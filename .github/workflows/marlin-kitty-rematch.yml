name: MARLIN vs KittyEngineV5 Rematch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/marlin-kitty-rematch.yml"

permissions:
  contents: read

concurrency:
  group: marlin-kitty-rematch
  cancel-in-progress: false

jobs:
  challenge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send one casual 5+0 rematch challenge
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${LICHESS_TOKEN:-}" ]]; then
            echo "::error::Missing LICHESS_TOKEN repository secret."
            exit 1
          fi

          echo "Challenging KittyEngineV5 to a casual Standard 5+0 game."
          echo "The accepting player is set to White, so MARLIN will play Black."
          echo "If Lichess returns HTTP 403, the token needs challenge:write in addition to bot:play."

          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --url "https://lichess.org/api/challenge/KittyEngineV5" \
            --header "Authorization: Bearer ${LICHESS_TOKEN}" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "rated=false" \
            --data-urlencode "clock.limit=300" \
            --data-urlencode "clock.increment=0" \
            --data-urlencode "color=white" \
            --data-urlencode "variant=standard")"

          challenge_url="$(jq -r '.challenge.url // .url // empty' <<<"$response")"
          challenge_id="$(jq -r '.challenge.id // .id // empty' <<<"$response")"

          if [[ -n "$challenge_url" ]]; then
            echo "Challenge created: $challenge_url"
          elif [[ -n "$challenge_id" ]]; then
            echo "Challenge created with ID: $challenge_id"
          else
            echo "Lichess response:"
            jq '{challenge: .challenge, url: .url, error: .error}' <<<"$response"
          fi
