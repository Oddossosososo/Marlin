name: MARLIN V10.1 dataset integrity tests
on:
  pull_request:
    paths:
      - "training/validate_learning_dataset.py"
      - "training/test_validate_learning_dataset.py"
      - ".github/workflows/marlin-v10.1-tests.yml"
  push:
    branches: ["v10.1/dataset-integrity"]
    paths:
      - "training/validate_learning_dataset.py"
      - "training/test_validate_learning_dataset.py"
      - ".github/workflows/marlin-v10.1-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "python-chess>=1.999"
      - name: Run dataset integrity tests
        working-directory: training
        run: python -m unittest -v test_validate_learning_dataset.py
