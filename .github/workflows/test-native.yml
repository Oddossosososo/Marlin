name: Native engine tests

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "cpp/**"
      - ".github/workflows/test-native.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "cpp/**"
      - ".github/workflows/test-native.yml"

jobs:
  rust-cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run native Rust/C++ tests
        run: cargo test --all-targets
