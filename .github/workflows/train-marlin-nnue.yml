name: Train MARLIN V5 NNUE

on:
  workflow_dispatch:
    inputs:
      games:
        description: "Stockfish self-play games"
        required: true
        default: "50"
      depth:
        description: "Stockfish teacher search depth"
        required: true
        default: "8"
      epochs:
        description: "Training epochs"
        required: true
        default: "15"
  push:
    paths:
      - ".github/workflows/train-marlin-nnue.yml"

concurrency:
  group: marlin-nnue-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          stockfish --version
      - name: Install training dependencies
        run: python -m pip install -r training/requirements.txt
      - name: Generate Stockfish teacher dataset
        env:
          GAMES: ${{ github.event.inputs.games || '50' }}
          TEACHER_DEPTH: ${{ github.event.inputs.depth || '8' }}
        run: |
          STOCKFISH_BIN="$(command -v stockfish)"
          python training/generate_dataset.py \
            --stockfish "$STOCKFISH_BIN" \
            --games "$GAMES" \
            --depth "$TEACHER_DEPTH" \
            --sample-every 2 \
            --out training/data/stockfish.jsonl
      - name: Train MARLIN's independent NNUE
        env:
          EPOCHS: ${{ github.event.inputs.epochs || '15' }}
        run: |
          python training/train_nnue.py \
            --data training/data/stockfish.jsonl \
            --epochs "$EPOCHS" \
            --out nnue/marlin-v4.nnue.json
      - name: Validate exported weights
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("nnue/marlin-v4.nnue.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["format"] == "MARLIN_NNUE_V1"
          assert data["architecture"] == "768x128x32x1"
          assert data["feature_encoding"] == "stm-relative-piece-square-v1"
          weights = data["weights"]
          assert len(weights["fc1_w"]) == 768
          assert all(len(row) == 128 for row in weights["fc1_w"])
          assert len(weights["fc2_w"]) == 128
          assert all(len(row) == 32 for row in weights["fc2_w"])
          assert len(weights["out_w"]) == 32
          print(f"Validated {path} ({path.stat().st_size:,} bytes)")
          print("Training metadata:", data["training"])
          PY
      - name: Upload trained weights and dataset
        uses: actions/upload-artifact@v4
        with:
          name: marlin-v5-nnue-candidate
          path: |
            nnue/marlin-v4.nnue.json
            training/data/stockfish.jsonl
          if-no-files-found: error
          retention-days: 30
